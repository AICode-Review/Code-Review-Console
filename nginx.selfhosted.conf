server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same clickjacking/MIME-sniffing protection as the Vercel deployment's vercel.json —
  # this admin console can suspend orgs and change billing, so framing it is a real risk,
  # not just best-practice fluff.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # react-router client-side routing — unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
